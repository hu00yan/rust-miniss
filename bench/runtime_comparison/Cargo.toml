[package]
name = "runtime-comparison"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "glommio_echo"
path = "glommio_echo.rs"
required-features = ["linux-bench"]

[[bin]]
name = "monoio_echo"
path = "monoio_echo.rs"
required-features = ["linux-bench"]

[[bin]]
name = "compio_echo"
path = "compio_echo.rs"

[[bin]]
name = "tokio_echo"
path = "tokio_echo.rs"

[[bin]]
name = "hyper_tokio_echo"
path = "hyper_tokio_echo.rs"

[features]
default = []
linux-bench = ["dep:monoio", "dep:glommio"]

[dependencies]
# compio 0.12 — last version that compiles on stable Rust (1.88+).
# Use minimal features for echo server benchmark.
compio = { version = "0.12", features = ["event", "runtime", "io"] }
compio-io = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "rt-multi-thread"] }
futures-lite = "1"
socket2 = "0.5"
# hyper-on-tokio control for the hyper-on-miniss benchmark comparison.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", default-features = true, features = ["sync", "macros"], optional = true }
glommio = { version = "0.9", optional = true }
