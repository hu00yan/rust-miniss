architecture_audit: |
  Adds no locks, runtime creation, blocking async calls, cross-core queue, or
  mutable shared state. RegisteredDescriptor owns one immutable Arc of OwnedFd
  so the existing Send-compatible stream interface remains intact.
  Each WriteStatic operation pays an atomic Arc lease instead of dup and close
  syscalls; UringBackend retains that lease until terminal CQE. epoll and kqueue
  continue using their correctness-first per-operation lease path.
  The multicore repair removes a shard-local busy-poll Vec and admits local
  futures to the existing owner TaskArena/ready queue. Task is explicitly
  non-Send; cross-core messages retain their Send bound. No lock, global queue,
  runtime creation, blocking async syscall, or cross-shard mutable state was
  added. Listener startup acknowledgement is control-plane-only.
