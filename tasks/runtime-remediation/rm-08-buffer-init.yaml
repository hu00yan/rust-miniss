# rm-08: Initialized-buffer correctness

## Problem (S0-6)

epoll/kqueue set_len then pass to safe Read → uninit as init (macOS too).

## Work

1. Buffer spare-capacity API or zeroed path.
2. Fix all fallback read sites.
3. Tests under Miri where possible.
