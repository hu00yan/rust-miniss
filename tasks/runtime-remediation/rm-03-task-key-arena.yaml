# rm-03: Generational TaskKey + arena

## Problem (S1-5)

u64 counter truncated to u32; cancel/wake by sequence → ABA / wrong task.

## Work

1. Introduce `TaskKey` / arena storage.
2. Migrate spawn/ready/cancel indexing to full keys.
3. Keep old TaskId as wrapper only if generation-safe.

## Out of scope

Waker Arc implementation (rm-04); cancel ack protocol (rm-10).
