# rm-04: Safe waker

## Problem (S0-1)

Rc + raw VecDeque + fake Send/Sync; timer thread wakes across threads.

## Work

1. `futures::task::ArcWake` or equivalent safe Wake.
2. Scheduled-bit dedup; closed-before-reclaim.
3. Fix/remove timer fallback thread path.

## Out of scope

Poll budget (rm-05); full cancel ack (rm-10).
