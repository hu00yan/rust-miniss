# rm-05: Per-turn poll budget

## Problem (S1-4)

`execute_tasks` drains forever; self-waker monopolizes shard.

## Work

1. Budget constant/config.
2. Return to event loop when budget exhausted; re-queue remainder.

## Out of scope

Message/CQE budgets beyond task polls (nice-to-have, not required).
