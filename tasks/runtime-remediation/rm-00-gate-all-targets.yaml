# rm-00: Repair all-target compile gate

## Problem

`cargo check --all-targets` fails: `tests/runtime_regressions.rs` calls private `IoToken::from_id`.

## Work

1. Either make a `#[cfg(test)]` / `pub(crate)` test constructor, or rewrite tests to construct tokens only via public submit paths.
2. Fix any trivial fmt/clippy blockers discovered while restoring the gate (only if in allowed_files; otherwise note deferral).

## Out of scope

Safety rewrites, waker, TLS, uring logic.

## Execution notes (2026-07-10)

- Moved generation-slot test into `src/cpu.rs` unit tests (keeps `IoToken::from_id` `pub(crate)`).
- Fixed clippy `if_same_then_else` in `process_io_completions` drain_limit (empty vs len&lt;8 both returned 128).
- Repaired stale fast-poll completion-tuple assertions and a close regression
  that dropped the accepted peer before the client shutdown completed.
- The multishot `POLL_ADD` smoke test is ignored until rm-14 adds runtime
  capability probing and capability-specific Linux stress coverage; the
  portable one-shot PollAdd regression remains in the default gate.
- `cargo test --all-targets` executes benchmark binaries, including the
  intentionally long-running `http_echo_tokio` listener. The gate therefore
  runs every test and example target; benchmark execution stays in
  `just bench-smoke`.
- `cargo fmt --all` normalized pre-existing formatting drift in the listed
  source, example, and test files; it does not change runtime behavior.
- Linux Orb evidence: `cargo fmt --all -- --check`, `cargo check --locked
  --all-targets --all-features`, `cargo clippy --locked --all-targets
  --all-features -- -D warnings`, and `cargo test --locked --tests --examples
  --all-features -- --nocapture` all pass.
