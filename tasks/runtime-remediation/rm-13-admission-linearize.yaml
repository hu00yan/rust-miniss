# rm-13: Admission linearization

## Verification (2026-07-11)

The admission ticket still spans shutdown cutoff through shard-local spawn;
`spawn_on` additionally waits for an owner reply after arena insertion. The
other retrying spawn paths still need the same acknowledgement treatment.

## Problem (S1-6)

Load Running then enqueue races shutdown independently.

## Verification (2026-07-11)

`MultiCoreRuntime` now closes an admission counter/bit before publishing
shutdown and waits for in-flight bounded sends. Post-cutoff spawn regression
passes on Orb Linux. Local-spawn queue ownership and explicit owner ack remain.
