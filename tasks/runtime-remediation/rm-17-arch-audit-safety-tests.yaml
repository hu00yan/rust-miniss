# rm-17: Arch-audit hardening + safety tests

## Problem

June script only caught pseudo-sync; not lifetime/UB patterns.

## Verification (2026-07-11)

The audit hard-fails escaped raw-Rc/TLS/unsafe-backend patterns and filters
cfg(test) control-path runtime calls; `just arch-audit` exits 0 with explicit
unsafe justifications. The Miri recipe targets pure TLS/waker/buffer tests and
explicitly excludes backend syscalls. The previous full-runtime Loom tests and
three independent bitset replacements were rejected as non-evidence.
`just loom` fails clearly until production seams exist. Static assertions and
two bounded property models run in `just test-fast`.
