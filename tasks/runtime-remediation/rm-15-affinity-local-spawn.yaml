# rm-15: Affinity + local spawn + HTTP

## Problem (S1-8)

HTTP cross-core spawn; fake block_on_cpu; logical CPUs; readiness before init.

## Verification (2026-07-11)

`spawn_local` accepts `!Send` futures in shard-local storage. Default worker
count uses physical CPU count, affinity failure is returned, startup readiness
waits for the initial bind, and HTTP handlers stay local. `block_on_cpu` now
rejects explicitly instead of creating a caller-thread runtime; non-contiguous
cpuset enumeration and full worker-TLS readiness remain.
