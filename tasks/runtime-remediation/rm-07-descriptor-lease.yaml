# rm-07: Descriptor lease + abandon ≠ reclaim

## Problem (S0-5)

Raw fd integers; drop clears waiter only; reuse → wrong file.

## Work

1. Internal lease type on PendingOp/Op acceptance.
2. Split waiter/delivery vs kernel ownership.
3. Tests: drop future before/after submit; fd reuse stress (Linux preferred).

## Out of scope

Full cancel opcode state machine (rm-09/rm-12); multishot policy (rm-14).

## Verification (2026-07-11)

Orb Linux io_uring regression `descriptor_lease_survives_numeric_fd_reuse`
submits a pipe read, closes/reuses the user fd for `/dev/null`, and verifies
the completion still reads the original pipe through the accepted lease.
