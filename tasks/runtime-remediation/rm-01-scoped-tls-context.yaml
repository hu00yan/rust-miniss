# rm-01: Scoped TLS / RuntimeContextGuard

## Problem (S0-2)

`io_state()` forges `&'static`; panic paths leave dangling TLS; nesting overwrites outer context.

## Work

1. Replace reference-returning TLS getters with `with_io_state(|s| ...)` (and timer/task analogs as needed).
2. `RuntimeContextGuard` on all install sites (`Runtime::block_on`, `CpuCore::run`).
3. Tests: panic restore, nest restore.

## Out of scope

Removing `Send` from backends (rm-02); full MultiCore block_on redesign (rm-15).
