# rm-14: Multishot accept

## Problem (S1-7)

Always AcceptMulti; unbounded VecDeque; raw fds; terminal hangs.

## Verification (2026-07-11)

Accept completions now carry `OwnedFd` through the backend queue and into the
stream conversion; dropping an overflowed or abandoned result closes it. When
the opcode or runtime kernel-version capability check is false, submission
uses single-shot `Accept` with retained sockaddr storage; Orb covers that
fallback. Listener drop now requests owner-backend cancellation; the target
terminal CQE retains resources until drain, and cancellation drops queued
`OwnedFd` results while clearing the live operation identity. Overflow and
sockaddr-parse paths retain one owner and close exactly once. Direct flag
probing remains a future refinement, but unsupported/old kernels do not assume
multishot.
