# rm-12: Bounded shutdown lifecycle

## Verification (2026-07-11)

Worker graceful exit now includes a backend-owned pending-operation count in
addition to task, ready-queue, and inbox emptiness. This closes the early
reclaim path for abandoned I/O; explicit driver cancellation/drain remains.

The coordinator now publishes explicit `Quiescing -> Cancelling -> DrainingIo
-> Joined/Failed` phases, with a regression covering phase publication. Forced
shutdown requests backend-wide cancellation and performs a bounded owner-thread
terminal drain before dropping task/driver state. Wakeup-poll operations are
cancelled and removed before the zero-pending-operation exit predicate.

## Problem (S1-3)

Stop flags + wait task count; no kernel drain; Drop does not join.
