# rm-16: QUIC + signal + global runtime

## Verification (2026-07-11)

Signal delivery remains bounded/non-blocking; a full inbox is logged while
per-core shutdown flags publish the lifecycle transition. QUIC ownership tests
pass. Global runtime now exposes `join_global` and bounded
`shutdown_global_with_timeout`, joining worker handles held in a control-plane
lock.

## Problem (S1-9.2–5)

QUIC token races; signal bypass; global runtime cannot join.
