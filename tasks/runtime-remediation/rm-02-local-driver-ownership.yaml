# rm-02: Local-only driver ownership

## Problem (S0-3)

Safe APIs allow concurrent mutation of backends via Send+Sync + Arc.

## Work

1. Split local driver vs Send control handle if needed.
2. Own driver in worker/`Runtime` directly.
3. Remove unsafe Send/Sync impls.

## Out of scope

Waker rewrite (rm-04); full RuntimeOwner split (rm-12).
