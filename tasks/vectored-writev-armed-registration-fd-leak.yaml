id: vectored-writev-armed-registration-fd-leak
title: 未回收的 readiness 注册让 AsyncTcpStream 永不 close(fd)（writev 护栏 33–60% 挂死）
branch: fix/io-backend-hygiene-and-macos-correctness
status: done

## 现象

`tests/vectored_io.rs::linux_uring_delayed_submit_writev_survives_relocation_pressure`
在 Linux/io_uring 上单跑（`--test-threads=1 --exact`）33–60% 挂死：card (b) 期间
11 次挂 6 次；把 (b) 的源码 `git stash` 掉后 10 次挂 6 次。因此与 (b) 无关，
(b) 只改了签名与注释，从没碰 `poll_write_vectored`。完整证据见
`docs/review/runtime-safety-findings.md` #43。

## 根因

挂死点在测试体 `peer.join()`，**不在 writev**：所有断言通过、`block_on` 已返回；
`ss -tinp` 显示客户端 fd 5 仍然 `ESTAB`，`send-q 0` / `recv-q 0`——数据已送达且被
对端读走，只是 **`close(2)` 从未被调用**，于是对端等 EOF 的阻塞 `read()` 永不返回。

fd 由 `Arc<OwnedFd>` 持有（`src/io/mod.rs:59`），每个已提交 op 会 clone 出一个
`DescriptorLease` 存进后端的 `descriptor_leases[slot]`，直到该 op 的终态 CQE 被
drain 才释放（`src/io/uring.rs` 426/513/1005/1668）。所以**一个永不回收的 op
会把 fd（以及整条 TCP 连接）一起钉住**，`drop(AsyncTcpStream)` 关不掉它。

三条既有设计叠加，会让一个注册被遗留下来：

1. `UringBackend::submit_inner` 有意不 flush（`src/io/uring.rs:994-995`），而
   `flush()` 在 `FLUSH_BATCH_SIZE = 61` 以下直接返回（`:170`、`:1349-1362`）——
   arm 的 SQE 通常由 `park` 提交，不是由 poll 提交。
2. `park_timeout` 默认只有 **100 µs**（`src/config.rs:50`）。
3. `park` 空手返回时，`Runtime::block_on` 会在**没有 waker 的情况下**继续
   re-poll future（`src/executor.rs:176-209`）。

这次 re-poll 会 `take()` 掉 `pollout_token`（`src/net.rs:666-672`），而
`clear_slot` 只清 cpu 侧槽位、后端什么都不释放（`src/cpu.rs:537-548`）；如果这次
重试的 `writev` 成功，future 即为 `Ready`，`block_on` 立即返回
（`src/executor.rs:107-110`），注册仍 armed 且 CQE 尚未 drain。此时已经没有任何
东西持有它的 token，`Drop for AsyncTcpStream`（`src/net.rs:463-475`）无处可
cancel，lease 永不释放，`close` 永不执行。重试落在 CQE drain 之前还是之后纯属
时序，这就是 33–60% 的来源。

读侧兄弟测试不暴露该缺陷，只是因为它的对端写完即返回、不等 EOF
（`tests/vectored_io.rs:279-286`）：本测试是仓库里唯一让「lease 滞留」可观测的
测试，所以它看起来像写路径 bug，实际是 close/存活性 bug。

## 修法方向

与 `read-readiness-collapse-and-close-delegate` 同源：把 readiness 注册收敛成
**一个所有者**，使被放弃的 arm 走「cancel + 释放 lease」，而不是留给后续
event-loop 回合。**（落地时这条被实测推翻，见下。）**

**两个不要走的捷径**（已核对过代码）：

1. 不要以为把重试路径的 `clear_slot` 换成 `cancel_and_discard` 就完事。
   `cancel_and_discard` → `UringBackend::cancel`（`src/io/uring.rs:1401-1434`）只是
   往环里推一个 `AsyncCancel` SQE 并立即返回，既不摘 `pending_ops`、也不释放
   `descriptor_leases`；它自己的注释就写着「A failed enqueue does not prove that
   the kernel operation is gone; retain the discard marker until a terminal CQE
   arrives」（`src/cpu.rs:504-506`）。**在这个后端里 lease 只可能被终态 CQE 释放**，
   所以只要驱动先返回，注册就必然被遗留下来。
2. （原写「别只去改 `Runtime::block_on` 的收尾 drain，`MultiCoreRuntime` 的
   worker 循环、shutdown 路径同样会在 armed 状态下停止」。**这条是错的，落地时
   用代码纠正**：worker 循环连续 drain、任务两次 poll 之间不 park，而 shutdown
   本来就已经 `cancel_all()` + 反复 park/drain 到
   `pending_operation_count() == 0`（`src/multicore.rs:836-844`，普通 drain 出口
   同样以该计数为条件 `:937`、`:1000`）。数据面在停车前就已经达到 quiescence，
   唯一漏掉这一步的是控制面兼容包装。见「实施记录」。）

真正的杠杆在 `RegisteredDescriptor::lease()`（`src/io/mod.rs:88-90`）：它**故意**
`Arc::clone` 而不 `dup(2)`（注释：without another descriptor syscall），于是「用户
可见的那个 fd 何时关闭」被绑死到「最后一个 op 何时被回收」。要么让 lease 持有独立
描述符（代价：每次 arm 一个 `dup`，而 arm 正是阻塞读写的常见路径，需要测量），要么
让 readiness 注册不再需要 lease（内核 poll 持有的是 `struct file` 引用，不是 fd），
要么给 drop 一条能同步释放/作废该注册的通路。三条都要单独权衡，不要在没有测量的
情况下选。

**选择了第四条：让驱动在返回前把被放弃的注册回收干净**，即
`Runtime::block_on` 在 future `Ready` 之后做有界 retire，其余三条（改 lease 语义 /
让 readiness 不需要 lease / 给 drop 一条同步通路）全部拒绝，理由见
`docs/DECISION_LOG.md` 与 `docs/review/runtime-safety-findings.md` #43。

## 非目标

- 不放宽、跳过或 ignore 任何测试；不调大 `park_timeout` 默认值来掩盖。
- 不把 `Runtime::block_on` 改造成数据面驱动：它是控制面兼容包装
  （`src/executor.rs:66` 的 arch-audit 注释）。
- 不改 `tests/vectored_io.rs` 的对端设计（它等 EOF 是对的）。

## 验收

- `--test-threads=1 --exact` 连跑 30 次 0 挂。
- 挂死路径上 fd 必被 `close`：对端必须能读到 EOF。
- `just check` / `just arch-audit` 干净；无新增 hot-path 锁或 runtime 创建。

## 实施记录

**根因是测出来的，不是推出来的。** 临时探针：`Drop for AsyncTcpStream` 里读一次
描述符标识的 `Arc::strong_count`，每次 arm 打一行，`release_descriptor_lease` 打
一行。6 次单跑给出精确不变量 `refs at drop = 1 + (arms - leases released)`：
挂的 5 次全是 `refs=2` 且 `arms/takes/releases` = 193/193/192、61/61/60、
63/63/62、135/135/134、125/125/124；唯一通过的那次 `refs=1` 且 236/236/236。
即**挂死运行上恰好有一个 lease（永远是最后一次 arm 的）活得比 stream 长**，
于是 `close(2)` 从不发生、对端永不见 EOF。探针在提交前已全部删除
（`git diff` 只剩 `src/executor.rs`，`src/net.rs` 是 (c) 自己的改动）。

**修法**：`Runtime::block_on` 在 future `Ready` 之后、`return` 之前调用
`retire_abandoned_registrations`（`src/executor.rs`）。readiness poll 是纯唤醒
注册（不带 payload）：stream 把 token 取回后重试成功，就再没有任何人会 await 它，
而它的 lease 只由终态 CQE 释放。这个 CQE 到那一刻通常**已经在完成队列里**——
结束等待的那次 `write(2)`/`writev(2)` 本身就是一次内核进入，`DEFER_TASKRUN` 的完成
task work 就在内核进入/退出时跑——所以第一次 drain 就能回收；只有内核尚未 post 的
情况才需要那次有界的 `park(park_timeout)`。`RETIRE_TURNS = 3`，且每轮先看
`pending_operation_count() == 0` 就退出，所以没有 I/O 的 `block_on` 一次
`cq.sync` 就返回，不会为这个修复付出 park 代价。顺手把 `block_on` 里两份逐字
相同的 drain-and-deliver 折成一个 `drain_and_deliver` 助手，而不是让它变成第三份。

**为什么不是另外三条**：让 lease 持有独立描述符 = 阻塞读写这条常见路径每次 arm 一个
`dup`；让 readiness 注册不带 lease = 把「lease 只管到提交为止」这条新生命周期规则
推广到所有 op（内核在提交时对 poll 取 `struct file` 引用，不是 fd），那是比本缺陷
大得多的语义决定；给 drop 一条同步通路 = 在 `Drop` 里做内核进入 + CQ 回收。这三条
都要单独测量和单独决策，本卡不动 lease 语义。

**修后验证**：同一探针 6/6 `rc=0` 且每次都 `releases = takes`
（273/273/273、257/257/257、243/243/243、160/160/160、263/263/263、249/249/249），
即每个 lease 都被回收；随后本卡验收 30/30 单跑 0 挂、每次 0–1 s，整包
`vectored_io` 连跑 3 次全绿（各约 3 s）。注意探针的口径：这 6 次里仍有 5 次在
`drop(writer)` 处 `refs > 1`（有一次 60），因为探针在 future **内部**触发，那时
retire 还没跑；stream 自己的 drop 关不掉 fd，是 `block_on` 返回前的 retire 关掉的，
而测试的 `peer.join()` 在 `block_on` 之后。

**残留（记录而非隐藏）**：若被放弃的注册的完成永远不会到达（例如被完成的 future
丢下的、socket 永不可读的 read 注册），它的 lease 仍然保留到 runtime 自己被 drop，
那也是所有 lease 的释放点。没有放宽/跳过/ignore 任何测试，没有调大
`park_timeout`，`tests/vectored_io.rs` 一行未改。

