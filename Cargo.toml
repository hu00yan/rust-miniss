[package]
name = "rust-miniss"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "A Rust implementation of miniss - a toy Seastar-like async runtime"
license = "MIT OR Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
# Core async primitives
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
pin-project = "1.1"

# Concurrency utilities
# NOTE: `dashmap` is deliberately NOT a dependency. See AGENTS.md MUST NOT #1.
crossbeam = "0.8"
crossbeam-queue = "0.3"
once_cell = "1.19"
crossbeam-channel = "0.5"
parking_lot = "0.12"

# System programming
nix = { version = "0.27", features = ["signal", "time", "sched", "fs"] }
libc = "0.2"
mio = { version = "1.0", features = ["os-poll", "net", "os-ext"] }
socket2 = { version = "0.5", features = ["all"] }

# I/O backends (io-uring is Linux-only)

# Slab for O(1) pending-operation storage keyed by io_uring user_data.
slab = "0.4.9"

# HTTP parsing and types
http = "1.0"
httparse = "1.8"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2", "server"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

# Utilities
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
num_cpus = "1.16"
itoa = "1.0"
rand = "0.8"
signal-hook = { version = "0.3", optional = true }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "signal", "io-util"] }
threadpool = "1.8"
tokio-util = { version = "0.7", features = ["compat"] }
tracing-test = "0.2.5"
tokio-rustls = { version = "0.26" }
smallvec = "1.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
static_assertions = "1.1"
proptest = { version = "1.4", features = ["std"] }  # For fuzz
loom = "0.7"
tokio = { version = "1", features = ["full"] }
tempfile = "3.8"
crc = "3.0"
tracing = "0.1"
reqwest = { version = "0.11", features = ["blocking"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.5"
rcgen = "0.13"
bytes = "1"
http-body-util = "0.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
h2 = "0.4"

[[example]]
name = "hello_world"

[[example]]
name = "http_echo"
path = "examples/http_echo.rs"

[[example]]
name = "udp_buffered"
path = "examples/udp_buffered.rs"

[[example]]
name = "spawn_micro"
path = "examples/spawn_micro.rs"

[[bench]]
name = "http_echo_tokio"
path = "bench/internal/http_echo_tokio.rs"
harness = false

[[bench]]
name = "runtime_benchmarks"
path = "bench/internal/runtime_benchmarks.rs"
harness = false

[[bench]]
name = "timer_benchmarks"
path = "bench/internal/timer_benchmarks.rs"
harness = false

[[bench]]
name = "cross_cpu_latency"
path = "bench/internal/cross_cpu_latency.rs"
harness = false

[[bench]]
name = "scheduling_throughput"
path = "bench/internal/scheduling_throughput.rs"
harness = false

[[bench]]
name = "perf_benchmark"
path = "bench/criterion/perf_benchmark.rs"
harness = false

[[bench]]
name = "memory_perf"
path = "bench/criterion/memory_perf.rs"
harness = false

[features]
# No optional dependencies. `default` previously enabled an `arena` feature that
# gated nothing but four buffer constructors duplicated verbatim from the
# non-arena ones, plus a `bumpalo` dependency and a `src/arena.rs` module with
# zero callers. It was removed; a bump arena is incompatible with `Buffer`'s
# owned-`Vec` + `set_len` + pooled-recycle model anyway.
default = []
debug = []  # Tracing spans, backtraces
tls = []
signal = ["dep:signal-hook"]

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7" }

[profile.release]
lto = true
codegen-units = 1
